name: CI
on:
  push:
    branches: [main, 'poc/**']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci -j
      - name: Test
        run: ctest --preset ci

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        run: cmake --preset msvc
      - name: Build
        run: cmake --build --preset msvc --parallel
      - name: Test
        run: ctest --preset msvc

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Install Clang and libFuzzer runtime
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev
      - name: Configure
        run: cmake --preset fuzz
      - name: Build
        run: cmake --build --preset fuzz -j --target fuzz_frame_parser
      - name: Fuzz frame parser (60 s)
        run: |
          mkdir -p corpus-work
          ./build/fuzz/tests/fuzz/fuzz_frame_parser -max_total_time=60 -max_len=8192 \
            corpus-work tests/fuzz/corpus
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*

  noise-poc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            config: -DPOC_SANITIZE=ON
          - os: windows-2022
            config: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S poc/noise-c -B build/poc-noise ${{ matrix.config }}
      - name: Build
        run: cmake --build build/poc-noise --config Debug --parallel
      - name: Test
        run: ctest --test-dir build/poc-noise -C Debug --output-on-failure
