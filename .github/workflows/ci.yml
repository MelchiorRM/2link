name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci -j
      - name: Test
        run: ctest --preset ci

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Configure
        run: cmake --preset msvc
      - name: Build
        run: cmake --build --preset msvc --parallel
      - name: Test
        run: ctest --preset msvc

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Install Clang and libFuzzer runtime
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev
      - name: Configure
        run: cmake --preset fuzz
      - name: Build
        run: cmake --build --preset fuzz -j --target fuzz_frame_parser fuzz_handshake_payload fuzz_announcement
      - name: Fuzz frame parser (60 s)
        run: |
          mkdir -p corpus-work
          ./build/fuzz/tests/fuzz/fuzz_frame_parser -max_total_time=60 -max_len=8192 \
            corpus-work tests/fuzz/corpus
      - name: Fuzz handshake payload decoder (30 s)
        run: |
          mkdir -p corpus-payload-work
          ./build/fuzz/tests/fuzz/fuzz_handshake_payload -max_total_time=30 -max_len=1024 \
            corpus-payload-work tests/fuzz/corpus_payload
      - name: Fuzz discovery announcement decoder (30 s)
        run: |
          mkdir -p corpus-announce-work
          ./build/fuzz/tests/fuzz/fuzz_announcement -max_total_time=30 -max_len=1024 \
            corpus-announce-work tests/fuzz/corpus_announce
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*
